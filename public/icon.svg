<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041E17" />
      <stop offset="50%" stop-color="#09352A" />
      <stop offset="100%" stop-color="#031611" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#99771B" />
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#09352A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Sacred Geometry Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="180" fill="url(#lanternGlow)" />

  <!-- Horseshoe / Mihrab Arch Silhouette -->
  <path d="M160 360 L160 250 C160 180, 200 130, 256 110 C312 130, 352 180, 352 250 L352 360 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-opacity="0.4" />
  
  <!-- Inner Geometric Framing -->
  <path d="M180 360 L180 260 C180 200, 210 160, 256 142 C302 160, 332 200, 332 260 L332 360" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 4" />

  <!-- Central Elegant Crescent Moon -->
  <path d="M275 195 C230 198, 196 234, 196 278 C196 325, 235 362, 283 360 C260 348, 245 324, 245 296 C245 250, 275 212, 275 195 Z" 
        fill="url(#goldGrad)" />

  <!-- 8-Pointed Star (Khatim / Rub el Hizb) Symbolizing Light & Guidance -->
  <g transform="translate(290, 220) scale(0.9)">
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="3" fill="#041E17" />
  </g>

  <!-- Grounding Horizontal Arch Base -->
  <line x1="140" y1="362" x2="372" y2="362" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
</svg>
